    <footer class="site-visitor-count" aria-label="사이트 전체 페이지뷰">
        <div id="site-visitor-count-widget">GoatCounter 로딩 중...</div>
    </footer>
    <script>
        (function () {
            var countWidget = document.getElementById('site-visitor-count-widget');

            if (!countWidget) {
                console.error('Unable to find the GoatCounter count widget.');
                return;
            }

            var attempts = 0;
            var waitForGoatCounter = window.setInterval(function () {
                attempts += 1;
                if (window.goatcounter && typeof window.goatcounter.visit_count === 'function') {
                    window.clearInterval(waitForGoatCounter);
                    countWidget.textContent = '';
                    try {
                        window.goatcounter.visit_count({
                            append: '#site-visitor-count-widget',
                            path: 'TOTAL',
                            style: 'div { border-color: #9c85c7; background-color: #241a38; color: #f5efff; }'
                        });
                    } catch (error) {
                        console.error('Unable to render the GoatCounter visitor count:', error);
                        countWidget.textContent = '방문 수를 불러오지 못했습니다.';
                    }
                } else if (attempts >= 100) {
                    window.clearInterval(waitForGoatCounter);
                    console.error('GoatCounter did not load within 10 seconds.');
                    countWidget.textContent = '방문 수를 불러오지 못했습니다.';
                }
            }, 100);
        })();
    </script>
