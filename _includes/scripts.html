    {% if site.google.analytics %}
    <!-- Asynchronous Google Analytics snippet -->
    <script>
      (function(i,s,o,g,r,a,m){i['GoogleAnalyticsObject']=r;i[r]=i[r]||function(){
        (i[r].q=i[r].q||[]).push(arguments)},i[r].l=1*new Date();a=s.createElement(o),
        m=s.getElementsByTagName(o)[0];a.async=1;a.src=g;m.parentNode.insertBefore(a,m)
      })(window,document,'script','//www.google-analytics.com/analytics.js','ga');
      ga('create', '{{ site.google.analytics }}', 'auto');  
      ga('require', 'linkid', 'linkid.js');
      ga('send', 'pageview');
    </script>

    <footer class="site-visitor-count" aria-label="사이트 전체 페이지뷰">
        <span>누적 페이지뷰</span>
        <strong id="site-visitor-count-value" aria-live="polite">불러오는 중...</strong>
    </footer>
    <script>
        (function () {
            var countElement = document.getElementById('site-visitor-count-value');
            var goatCounterScript = document.querySelector('script[data-goatcounter]');

            if (!countElement || !goatCounterScript) {
                console.error('Unable to find the GoatCounter count element or script.');
                return;
            }

            var countEndpoint = goatCounterScript.getAttribute('data-goatcounter')
                .replace(/\/count\/?$/, '/counter/TOTAL.json');

            fetch(countEndpoint)
                .then(function (response) {
                    if (!response.ok) {
                        throw new Error('GoatCounter returned HTTP ' + response.status);
                    }
                    return response.json();
                })
                .then(function (data) {
                    if (typeof data.count !== 'string') {
                        throw new Error('GoatCounter returned an invalid count.');
                    }
                    countElement.textContent = data.count;
                })
                .catch(function (error) {
                    console.error('Unable to load the total pageview count:', error);
                    countElement.textContent = '불러오지 못함';
                });
        })();
    </script>
