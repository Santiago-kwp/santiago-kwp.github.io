<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="title desc">
  <title id="title">전통적 핀홀 카메라 모형</title>
  <desc id="desc">물체, 핀홀, 영상 평면과 광선의 경로. 핀홀 뒤의 영상은 도립상이다.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#455a64"/>
    </marker>
    <style>
      text { font-family: sans-serif; fill: #263238; font-size: 18px; }
      .plane { stroke: #455a64; stroke-width: 3; }
      .axis { stroke: #78909c; stroke-width: 2; stroke-dasharray: 8 6; }
      .ray { stroke: #e76f51; stroke-width: 2.5; fill: none; }
      .measure { stroke: #455a64; stroke-width: 1.8; marker-start: url(#arrow); marker-end: url(#arrow); }
      .guide { stroke: #90a4ae; stroke-width: 1.4; }
      .point { fill: #e76f51; }
    </style>
  </defs>
  <text x="150" y="34" text-anchor="middle">물체 평면</text>
  <text x="450" y="34" text-anchor="middle">핀홀</text>
  <text x="660" y="34" text-anchor="middle">영상 평면</text>
  <line class="axis" x1="65" y1="180" x2="825" y2="180"/>
  <text x="830" y="186">광학축</text>
  <line class="plane" x1="150" y1="65" x2="150" y2="295"/>
  <line class="plane" x1="450" y1="65" x2="450" y2="165"/>
  <line class="plane" x1="450" y1="195" x2="450" y2="295"/>
  <circle class="point" cx="450" cy="180" r="7"/>
  <line class="plane" x1="660" y1="65" x2="660" y2="295"/>
  <line class="ray" x1="150" y1="100" x2="450" y2="180"/>
  <line class="ray" x1="450" y1="180" x2="660" y2="236"/>
  <line class="ray" x1="150" y1="260" x2="450" y2="180"/>
  <line class="ray" x1="450" y1="180" x2="660" y2="124"/>
  <circle class="point" cx="150" cy="100" r="4"/>
  <circle class="point" cx="660" cy="236" r="4"/>
  <circle class="point" cx="660" cy="124" r="4"/>
  <text x="128" y="96" text-anchor="end">A</text>
  <text x="678" y="242">A′</text>
  <text x="728" y="96">도립상</text>
  <line class="guide" x1="150" y1="100" x2="96" y2="100"/>
  <line class="guide" x1="150" y1="260" x2="96" y2="260"/>
  <line class="measure" x1="105" y1="104" x2="105" y2="256"/>
  <text x="105" y="88" text-anchor="middle">X</text>
  <line class="guide" x1="660" y1="124" x2="716" y2="124"/>
  <line class="guide" x1="660" y1="236" x2="716" y2="236"/>
  <line class="measure" x1="706" y1="128" x2="706" y2="232"/>
  <text x="706" y="116" text-anchor="middle">x</text>
  <line class="guide" x1="150" y1="270" x2="150" y2="324"/>
  <line class="guide" x1="450" y1="195" x2="450" y2="324"/>
  <line class="measure" x1="156" y1="310" x2="444" y2="310"/>
  <text x="300" y="302" text-anchor="middle">Z</text>
  <line class="guide" x1="660" y1="240" x2="660" y2="324"/>
  <line class="measure" x1="456" y1="310" x2="654" y2="310"/>
  <text x="555" y="302" text-anchor="middle">f</text>
  <text x="450" y="350" text-anchor="middle">닮은꼴 삼각형: −x / f = X / Z</text>
</svg>
